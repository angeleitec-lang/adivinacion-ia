# Plantilla QLoRA 4-bit para Qwen2.5-14B-Instruct (modelo final).
#
# NO ejecutar todavía: el dataset está pendiente de la revisión humana del 3 %
# y de pasar preparar_entrenamiento.py con semáforo verde.
#
# Las claves de Soup se han contrastado con su documentación, pero la versión
# instalada en nodo1 no se ha comprobado. Antes de entrenar:
#   soup --help  (y el modo de prueba que documente la versión instalada)
# Si una clave no existe, Soup debe fallar en voz alta; no la elimines a ciegas.
#
# Este es el modelo principal de MODELO.md. El 7B sirve para iterar; el 14B
# solo se entrena cuando el 7B demuestra que la receta y los datos funcionan.
#
# Longitudes REALES del dataset v1 parcial (5.205 filas train, estimación
# caracteres/3,5; recálculo: finetune/entrenamiento/ajuste_config.py):
#   p50 1.510 · p95 3.233 · p99 3.869 · máx 4.166 · media 1.611 tokens.
#   Familia más larga: astro_natal (p99 4.131, máx 4.166).
#   max_length 4096 cubre ≥99,8 % sin truncar (10 filas por encima, <0,01 %
#   de tokens perdidos). Decisión T111; ver docs/PLAN_ENTRENAMIENTO.md.

base: Qwen/Qwen2.5-14B-Instruct

task: sft

data:
  train: finetune/corpus/final/preparado/train.jsonl
  # Soup puede separar validación del propio train. Si se usa el val.jsonl
  # preparado, añadir `val:` solo después de verificar que la clave existe.
  format: chatml
  val_split: 0.05
  # 4096: cubre p99 (3.869) con margen para el solape ChatML. Ver cabecera.
  max_length: 4096

training:
  epochs: 3
  # Menos lr que el 7B: el 14B acumula más señal por paso y con 2e-4 suele
  # sobreajustar o desestabilizarse. Si el loss baja muy despacio, subir a
  # 1.5e-4 antes que tocar otros hiperparámetros.
  lr: 0.0001
  # Memoria estimada 14B@4096 bs2 con checkpointing (ajuste_config.py):
  # ~48 GB (pesos 7,8 + optimizador r=32 0,4 + activaciones 40,1; ±40 %
  # → 29-68 GB). Cabe con margen ≥60 GB en los 128 GB unificados.
  # Batch 2 × accum 8 = lote efectivo 16, igual que el 7B.
  batch_size: 2
  gradient_accumulation_steps: 8
  # Lote efectivo = 2 × 8 = 16 ejemplos por paso.
  eval_steps: 50
  save_steps: 100
  warmup_ratio: 0.03
  weight_decay: 0.01
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  quantization: 4bit
  # QLoRA 4-bit: NF4, doble cuantización y cómputo en bf16 si el backend ROCm
  # lo permite. Si Soup no acepta estas claves, dejarlas en sus valores por
  # defecto y anotarlo en ESTADO.md.
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  # PÉRDIDA SOLO SOBRE LA RESPUESTA DEL ASISTENTE (T111): la pérdida debe
  # calcularse en los tokens de los turnos "assistant"/"gpt" y enmascarar
  # system y human. En ChatML es el comportamiento estándar de las
  # implementaciones SFT habituales (mask sobre prompt), pero en Soup NO está
  # verificado: comprobar con `soup --help` el nombre de la clave
  # (p. ej. train_on_prompt: false / mask_user_system: true) y confirmarlo en
  # la prueba corta antes de la tanda. Si no existe la clave, verificar en el
  # log que las pérdidas de system/user no contribuyen.

output: finetune/entrenamiento/salida/14b
